<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tree Points Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.8/dist/esri-leaflet.js"></script>

  <style>
    body, html { margin:0; padding:0; height:100%; }
    #map { height:100%; }

    .locate-btn {
      position:absolute;
      bottom:20px;
      left:20px;
      z-index:1000;
      background:white;
      border:1px solid #ccc;
      padding:8px 12px;
      border-radius:6px;
      cursor:pointer;
      box-shadow:0 2px 6px rgba(0,0,0,0.25);
    }

    .delete-btn {
      width:100%;
      padding:6px 10px;
      background:#cc0000;
      color:white;
      border:none;
      border-radius:4px;
      cursor:pointer;
      margin-top:6px;
    }
	.tree-icon {
  font-size: 20px;
  line-height: 20px;
}

  </style>
</head>

<body>
<button class="locate-btn" id="locateBtn">📍 Locate Me</button>
<div id="map"></div>

<script>
// ----------------------
// Basemaps
// ----------------------
const imagery = L.esri.imageMapLayer({
  url: "https://services.gis.nc.gov/secure/rest/services/Imagery/Orthoimagery_Latest/ImageServer"
});

const topo = L.esri.basemapLayer("Topographic");

// ----------------------
// Map init
// ----------------------
const map = L.map("map", {
  center: [35.912, -79.08],
  zoom: 16,
  layers: [topo]
});

L.control.layers(
  { "NC Imagery": imagery, "Esri Topographic": topo },
  {},
  { collapsed:false }
).addTo(map);

// ----------------------
// FeatureLayer
// ----------------------
const featureLayerUrl =
  "https://services5.arcgis.com/uqbGfOz5OnchALvN/arcgis/rest/services/general_purpose_point_layer/FeatureServer/0";

const featureLayer = L.esri.featureLayer({
  url: featureLayerUrl,
  where: "expired <> 'yes' OR expired IS NULL",
	pointToLayer: function (feature, latlng) {
	  return L.marker(latlng, {
		icon: L.divIcon({
		  className: "tree-icon",
		  html: "🌳",
		  iconSize: [24, 24],
		  iconAnchor: [12, 12]
		})
	  });
	}
,
  onEachFeature: function (feature, layer) {
    const attrs = feature.properties || feature.attributes || {};
    const notes = attrs.Notes || "(no notes added)";
    const objectId = attrs.OBJECTID;

    const popupHTML = `
      <div>
        <strong>Notes:</strong><br>
        <div style="margin:6px 0; padding:6px; border:1px solid #ccc;">
          ${notes}
        </div>
        <button class="delete-btn" id="deletePointBtn">Delete Point</button>
      </div>
    `;

    layer.bindPopup(popupHTML);

    layer.on("popupopen", function (ev) {
      const popupEl = ev.popup.getElement();
      const btn = popupEl.querySelector("#deletePointBtn");
      if (!btn || objectId == null) return;

		btn.onclick = function () {
		  softDeleteOnServer(objectId, function (ok) {
			if (ok) {
			  // Just remove the marker from the map
			  layer.remove();
			} else {
			  console.warn("Soft delete failed for OBJECTID", objectId);
			}
		  });
		};


    });
  }
}).addTo(map);

// ----------------------
// Add point flow
// ----------------------
map.on("click", function (e) {
  if (e.originalEvent.target.classList.contains("leaflet-interactive")) return;

  const latlng = e.latlng;

  const popupHTML = `
    <div>
      <textarea id="newPointNotes"
        placeholder="Optional notes…"
        style="width:100%;height:60px;"></textarea>

      <input type="file" id="newPointPhoto"
        accept="image/*"
        style="margin-top:8px;width:100%;">

      <button id="addPointBtn" style="
        margin-top:8px;
        width:100%;
        padding:6px;
        background:#0078ff;
        color:white;
        border:none;
        border-radius:4px;
        cursor:pointer;
      ">Add Point</button>
    </div>
  `;

  L.popup()
    .setLatLng(latlng)
    .setContent(popupHTML)
    .openOn(map);

  window._pendingLatLng = latlng;
});

// delegated handler for Add Point
document.addEventListener("click", function (e) {
  if (e.target && e.target.id === "addPointBtn") {
    const textarea = document.getElementById("newPointNotes");
    const photoInput = document.getElementById("newPointPhoto");
    const notes = textarea ? textarea.value.trim() : "";
    const latlng = window._pendingLatLng;

    if (!latlng) return;

    addNewPoint(latlng, notes, photoInput);

    map.closePopup();
    window._pendingLatLng = null;
  }
});

// ----------------------
// Add feature + optional attachment
// ----------------------
function addNewPoint(latlng, notes, photoInput) {
  featureLayer.addFeature({
    type: "Feature",
    geometry: {
      type: "Point",
      coordinates: [latlng.lng, latlng.lat]
    },
    properties: {
      Notes: notes || "",
      expired: "no"
    }
  }, function (err, result) {
    if (err) {
      console.warn("Add feature failed:", err);
      return;
    }

    console.log("Add feature result:", result);

    const objectId = result && result.objectId;
    if (!objectId) return;

    if (photoInput && photoInput.files && photoInput.files.length > 0) {
      const file = photoInput.files[0];
      uploadAttachment(objectId, file);
    }
  });
}

// ----------------------
// Soft delete on server (expired = "yes")
// ----------------------
function softDeleteOnServer(objectId, callback) {
  const url = featureLayerUrl + "/updateFeatures";

  const featurePayload = [{
    attributes: {
      OBJECTID: objectId,
      expired: "yes"
    }
  }];

  const params = new URLSearchParams({
    features: JSON.stringify(featurePayload),
    f: "json"
  });

  fetch(url, {
    method: "POST",
    body: params
  })
  .then(r => r.json())
  .then(result => {
    console.log("Soft delete result:", result);
    const res = result.updateResults && result.updateResults[0];
    const ok = !!(res && res.success);
    if (!ok) {
      console.warn("Soft delete error:", res && res.error);
    }
    if (callback) callback(ok);
  })
  .catch(err => {
    console.warn("Soft delete request error:", err);
    if (callback) callback(false);
  });
}

// ----------------------
// Upload attachment
// ----------------------
function uploadAttachment(objectId, file) {
  const url =
    featureLayerUrl + "/" + objectId + "/addAttachment";

  const formData = new FormData();
  formData.append("attachment", file);
  formData.append("f", "json");

  fetch(url, {
    method: "POST",
    body: formData
  })
  .then(r => r.json())
  .then(result => {
    console.log("Attachment upload result:", result);
  })
  .catch(err => {
    console.error("Attachment upload failed:", err);
  });
}

// ----------------------
// Geolocation
// ----------------------
document.getElementById("locateBtn").onclick = function () {
  map.locate({ setView: true, maxZoom: 17 });
};

map.on("locationfound", function (e) {
  L.circleMarker(e.latlng, {
    radius: 8,
    color: "blue",
    weight: 2,
    fillOpacity: 0.7
  }).addTo(map);
});
</script>
</body>
</html>
