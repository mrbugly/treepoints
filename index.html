<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tree Points Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.8/dist/esri-leaflet.js"></script>

  <style>
    body, html { margin:0; padding:0; height:100%; }
    #map { height:100%; }

    .locate-btn {
      position:absolute;
      bottom:20px;
      left:20px;
      z-index:1000;
      background:white;
      border:1px solid #ccc;
      padding:8px 12px;
      border-radius:6px;
      cursor:pointer;
      box-shadow:0 2px 6px rgba(0,0,0,0.25);
    }

    .delete-btn {
      width:100%;
      padding:6px 10px;
      background:#cc0000;
      color:white;
      border:none;
      border-radius:4px;
      cursor:pointer;
      margin-top:6px;
    }

    /* 🌳 Emoji tree marker */
    .tree-icon {
      font-size: 24px;
      line-height: 24px;
    }

    /* 📎 Attach File button */
    .attach-btn {
      display: inline-block;
      padding: 4px;
      background: #0078ff;
      color: white;
      border-radius: 0px;
      cursor: pointer;
      text-align: center;
      width: 80%;
      margin-top: 6px;
      font-size: 14px;
    }

	.measure-btn {
	  position:absolute;
	  bottom:70px;
	  left:20px;
	  z-index:1000;
	  background:white;
	  border:1px solid #ccc;
	  padding:8px 12px;
	  border-radius:6px;
	  cursor:pointer;
	  box-shadow:0 2px 6px rgba(0,0,0,0.25);
	}

	.measure-btn.active {
	  background:#0078ff;
	  color:white;
	  border-color:#005fcc;
	}

	.measure-cursor {
	  cursor: crosshair !important;
	}


	.edit-btn {
	  width:100%;
	  padding:6px 10px;
	  background:#0078ff;
	  color:white;
	  border:none;
	  border-radius:4px;
	  cursor:pointer;
	  margin-top:6px;
	}




    /* Hide default file input */
    #newPointPhoto {
      display: none;
    }
  </style>
</head>

<body>
<button class="locate-btn" id="locateBtn">📍 Locate Me</button>
<button class="measure-btn" id="measureBtn">📏 Measure</button>
<div id="map"></div>

<script>
// ----------------------
// Basemaps
// ----------------------
const imagery = L.esri.imageMapLayer({
  url: "https://services.gis.nc.gov/secure/rest/services/Imagery/Orthoimagery_Latest/ImageServer"
});

const topo = L.esri.basemapLayer("Topographic");

// ----------------------
// Map init
// ----------------------
const map = L.map("map", {
  center: [35.912, -79.08],
  zoom: 16,
  layers: [topo]
});

L.control.layers(
  { "NC Imagery": imagery, "Esri Topographic": topo },
  {},
  { collapsed:false }
).addTo(map);

// ----------------------
// FeatureLayer
// ----------------------
const featureLayerUrl =
  "https://services5.arcgis.com/uqbGfOz5OnchALvN/arcgis/rest/services/general_purpose_point_layer/FeatureServer/0";

const featureLayer = L.esri.featureLayer({
  url: featureLayerUrl,
  where: "expired <> 'yes' OR expired IS NULL",

  pointToLayer: function (feature, latlng) {
    return L.marker(latlng, {
      icon: L.divIcon({
        className: "tree-icon",
        html: "🌳",
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      })
    });
  },

	onEachFeature: function (feature, layer) {
	  const attrs = feature.properties || feature.attributes || {};
	  const objectId = attrs.OBJECTID;

	  const popupHTML = `
		<div>
		  <strong>Notes:</strong><br>
		  <div id="notesDisplay" style="margin:6px 0; padding:6px; border:1px solid #ccc;"></div>

		  <button class="edit-btn" id="editNotesBtn">Edit Notes</button>
		  <button class="delete-btn" id="deletePointBtn">Delete Point</button>
		</div>
	  `;

	  layer.bindPopup(popupHTML);

	  layer.on("popupopen", function (ev) {
		const popupEl = ev.popup.getElement();
		const notesBox = popupEl.querySelector("#notesDisplay");

		// 🔹 Always show the *current* Notes from the feature
		const currentNotes = (layer.feature.properties.Notes || "").trim();
		notesBox.textContent = currentNotes || "(no notes added)";

		const editBtn = popupEl.querySelector("#editNotesBtn");
		const deleteBtn = popupEl.querySelector("#deletePointBtn");

		// EDIT NOTES
		if (editBtn) {
		  editBtn.onclick = function () {
			notesBox.innerHTML = `
			  <textarea id="editNotesArea"
				style="width:100%;height:80px;">${currentNotes}</textarea>
			  <button id="saveNotesBtn"
				style="margin-top:8px;width:100%;padding:6px;background:#28a745;color:white;border:none;border-radius:4px;cursor:pointer;">
				Save Notes
			  </button>
			`;

			const saveBtn = popupEl.querySelector("#saveNotesBtn");
			saveBtn.onclick = function () {
			  const newNotes = popupEl.querySelector("#editNotesArea").value.trim();

			  updateNotesOnServer(objectId, newNotes, function (ok) {
				if (ok) {
				  // 🔹 Update local feature
				  layer.feature.properties.Notes = newNotes;

				  // 🔹 Restore plain text display
				  notesBox.textContent = newNotes || "(no notes added)";
				} else {
				  console.warn("Failed to update notes for OBJECTID", objectId);
				}
			  });
			};
		  };
		}

		// DELETE POINT
		if (deleteBtn) {
		  deleteBtn.onclick = function () {
			softDeleteOnServer(objectId, function (ok) {
			  if (ok) layer.remove();
			});
		  };
		}
	  });
	}

}).addTo(map);


// ----------------------
// Popup handler 
// ----------------------

function attachPopupHandlers(layer, objectId) {
  const popupEl = layer.getPopup().getElement();

  const editBtn = popupEl.querySelector("#editNotesBtn");
  const deleteBtn = popupEl.querySelector("#deletePointBtn");

  if (editBtn) {
    editBtn.onclick = function () {
      const notesBox = popupEl.querySelector("#notesDisplay");
      const currentNotes = notesBox.innerText.trim();

      notesBox.innerHTML = `
        <textarea id="editNotesArea"
          style="width:100%;height:80px;">${currentNotes}</textarea>
        <button id="saveNotesBtn"
          style="margin-top:8px;width:100%;padding:6px;background:#28a745;color:white;border:none;border-radius:4px;cursor:pointer;">
          Save Notes
        </button>
      `;

      const saveBtn = popupEl.querySelector("#saveNotesBtn");
      saveBtn.onclick = function () {
        const newNotes = popupEl.querySelector("#editNotesArea").value.trim();
        updateNotesOnServer(objectId, newNotes, function (ok) {
          if (ok) {
            layer.feature.properties.Notes = newNotes;
            notesBox.innerHTML = newNotes;

            notesBox.insertAdjacentHTML("afterend", `
              <button class="edit-btn" id="editNotesBtn">Edit Notes</button>
              <button class="delete-btn" id="deletePointBtn">Delete Point</button>
            `);

            attachPopupHandlers(layer, objectId);
          }
        });
      };
    };
  }

  if (deleteBtn) {
    deleteBtn.onclick = function () {
      softDeleteOnServer(objectId, function (ok) {
        if (ok) layer.remove();
      });
    };
  }
}





// ----------------------
// Update Notes 
// ----------------------
function updateNotesOnServer(objectId, newNotes, callback) {
  const url = featureLayerUrl + "/updateFeatures";

  const featurePayload = [{
    attributes: {
      OBJECTID: objectId,
      Notes: newNotes
    }
  }];

  const params = new URLSearchParams({
    features: JSON.stringify(featurePayload),
    f: "json"
  });

  fetch(url, {
    method: "POST",
    body: params
  })
  .then(r => r.json())
  .then(result => {
    const res = result.updateResults && result.updateResults[0];
    const ok = !!(res && res.success);
    callback(ok);
  })
  .catch(err => {
    console.warn("Update notes request error:", err);
    callback(false);
  });
}



// ----------------------
// Add point flow 📎 
// ----------------------
map.on("click", function (e) {

  // 🚫 BLOCK add‑point popup when measuring
  if (measuring) return;

  if (e.originalEvent.target.classList.contains("leaflet-interactive")) return;

  const latlng = e.latlng;

  const popupHTML = `
    <div>
      <textarea id="newPointNotes"
        placeholder="Optional notes…"
        style="width:100%;height:60px;"></textarea>

      <input type="file" id="newPointPhoto" accept="image/*">

      <div class="attach-btn" id="attachFileBtn">Attach File</div>

      <button id="addPointBtn" style="
      display: inline-block;
      padding: 4px;
      background: #0078ff;
      color: white;
      border-radius: 0px;
      cursor: pointer;
      text-align: center;
      width: 80%;
      margin-top: 6px;
      font-size: 14px;
      ">Add Point</button>
    </div>
  `;

  L.popup()
    .setLatLng(latlng)
    .setContent(popupHTML)
    .openOn(map);

  window._pendingLatLng = latlng;
});

// ----------------------
// Delegated click handler
// ----------------------
document.addEventListener("click", function (e) {

  // 📎 Attach File button
  if (e.target && e.target.id === "attachFileBtn") {
    document.getElementById("newPointPhoto").click();
  }

  // Add Point button
  if (e.target && e.target.id === "addPointBtn") {
    const textarea = document.getElementById("newPointNotes");
    const photoInput = document.getElementById("newPointPhoto");
    const notes = textarea ? textarea.value.trim() : "";
    const latlng = window._pendingLatLng;

    if (!latlng) return;

    addNewPoint(latlng, notes, photoInput);

    map.closePopup();
    window._pendingLatLng = null;
  }
});

// ----------------------
// Add feature + optional attachment
// ----------------------
function addNewPoint(latlng, notes, photoInput) {
  featureLayer.addFeature({
    type: "Feature",
    geometry: {
      type: "Point",
      coordinates: [latlng.lng, latlng.lat]
    },
    properties: {
      Notes: notes || "",
      expired: "no"
    }
  }, function (err, result) {
    if (err) {
      console.warn("Add feature failed:", err);
      return;
    }

    const objectId = result && result.objectId;
    if (!objectId) return;

    if (photoInput && photoInput.files && photoInput.files.length > 0) {
      uploadAttachment(objectId, photoInput.files[0]);
    }
  });
}

// ----------------------
// Soft delete on server
// ----------------------
function softDeleteOnServer(objectId, callback) {
  const url = featureLayerUrl + "/updateFeatures";

  const featurePayload = [{
    attributes: {
      OBJECTID: objectId,
      expired: "yes"
    }
  }];

  const params = new URLSearchParams({
    features: JSON.stringify(featurePayload),
    f: "json"
  });

  fetch(url, {
    method: "POST",
    body: params
  })
  .then(r => r.json())
  .then(result => {
    const res = result.updateResults && result.updateResults[0];
    const ok = !!(res && res.success);
    if (!ok) console.warn("Soft delete error:", res && res.error);
    callback(ok);
  })
  .catch(err => {
    console.warn("Soft delete request error:", err);
    callback(false);
  });
}

// ----------------------
// Upload attachment
// ----------------------
function uploadAttachment(objectId, file) {
  const url = featureLayerUrl + "/" + objectId + "/addAttachment";

  const formData = new FormData();
  formData.append("attachment", file);
  formData.append("f", "json");

  fetch(url, {
    method: "POST",
    body: formData
  })
  .then(r => r.json())
  .then(result => {
    console.log("Attachment upload result:", result);
  })
  .catch(err => {
    console.error("Attachment upload failed:", err);
  });
}

// ----------------------
// Geolocation
// ----------------------
document.getElementById("locateBtn").onclick = function () {
  map.locate({ setView: true, maxZoom: 17 });
};

map.on("locationfound", function (e) {
  L.circleMarker(e.latlng, {
    radius: 8,
    color: "blue",
    weight: 2,
    fillOpacity: 0.7
  }).addTo(map);
});


// ----------------------
// Measure
// ----------------------
let measuring = false;
let measureStart = null;

// Arrays to store ALL measurement graphics
let measureLines = [];
let measureMarkers = [];
let measureLabels = [];

const measureBtn = document.getElementById("measureBtn");

// Toggle measure mode
measureBtn.onclick = function () {
  measuring = !measuring;

  if (measuring) {
    measureBtn.classList.add("active");
    map.getContainer().classList.add("measure-cursor");
    measureStart = null;
  } else {
    measureBtn.classList.remove("active");
    map.getContainer().classList.remove("measure-cursor");
    clearAllMeasurements();
  }
};

// Clear ALL measurement graphics
function clearAllMeasurements() {
  measureStart = null;

  measureLines.forEach(line => map.removeLayer(line));
  measureMarkers.forEach(marker => map.removeLayer(marker));
  measureLabels.forEach(label => map.removeLayer(label));

  measureLines = [];
  measureMarkers = [];
  measureLabels = [];
}

// MEASURE CLICK HANDLER
map.on("click", function (e) {

  // 🚫 BLOCK add‑point popup when measuring
  if (!measuring) return;

  L.DomEvent.stop(e);

  // FIRST POINT
  if (!measureStart) {
    measureStart = e.latlng;

    const marker1 = L.marker(e.latlng, {
      icon: L.divIcon({
        className: "measure-point",
        html: "<div style='background:#0078ff;color:white;padding:4px 6px;border-radius:4px;font-size:14px;'>1</div>",
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      })
    }).addTo(map);

    measureMarkers.push(marker1);
    return;
  }

  // SECOND POINT
  const measureEnd = e.latlng;

  const marker2 = L.marker(measureEnd, {
    icon: L.divIcon({
      className: "measure-point",
      html: "<div style='background:#0078ff;color:white;padding:4px 6px;border-radius:4px;font-size:14px;'>2</div>",
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    })
  }).addTo(map);

  measureMarkers.push(marker2);

  // Compute distance
  const meters = measureStart.distanceTo(measureEnd);
  const feet = meters * 3.28084;

  // Draw dashed line
  const line = L.polyline([measureStart, measureEnd], {
    color: "blue",
    weight: 3,
    dashArray: "6, 6"
  }).addTo(map);

  measureLines.push(line);

  // Floating label (no popup)
  const label = L.marker(measureEnd, {
    icon: L.divIcon({
      className: "measure-label",
      html: `<div style="
        background:white;
        border:1px solid #0078ff;
        padding:4px 6px;
        border-radius:4px;
        font-size:14px;
        color:#0078ff;
        white-space:nowrap;
      ">${feet.toFixed(1)} ft</div>`,
      iconSize: [80, 24],
      iconAnchor: [40, -10]
    })
  }).addTo(map);

  measureLabels.push(label);

  // Reset for next measurement
  measureStart = null;
});






</script>
</body>
</html>
