<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tree Points Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.8/dist/esri-leaflet.js"></script>

  <style>
    body, html { margin:0; padding:0; height:100%; }
    #map { height:100%; }

    .locate-btn {
      position:absolute;
      bottom:20px;
      left:20px;
      z-index:1000;
      background:white;
      border:1px solid #ccc;
      padding:8px 12px;
      border-radius:6px;
      cursor:pointer;
      box-shadow:0 2px 6px rgba(0,0,0,0.25);
    }

    .delete-btn {
      width:100%;
      padding:6px 10px;
      background:#cc0000;
      color:white;
      border:none;
      border-radius:4px;
      cursor:pointer;
      margin-top:6px;
    }
  </style>
</head>

<body>
<button class="locate-btn" id="locateBtn">📍 Locate Me</button>
<div id="map"></div>

<script>
// ----------------------
// LocalStorage helpers
// ----------------------
function loadPoints() {
  return JSON.parse(localStorage.getItem("points") || "[]");
}

function savePoints(points) {
  localStorage.setItem("points", JSON.stringify(points));
}

function loadDeleteQueue() {
  return JSON.parse(localStorage.getItem("deleteQueue") || "[]");
}

function saveDeleteQueue(queue) {
  localStorage.setItem("deleteQueue", JSON.stringify(queue));
}

// ----------------------
// Basemaps
// ----------------------
const imagery = L.esri.imageMapLayer({
  url: "https://services.gis.nc.gov/secure/rest/services/Imagery/Orthoimagery_Latest/ImageServer"
});

const topo = L.esri.basemapLayer("Topographic");

// ----------------------
// Map init
// ----------------------
const map = L.map("map", {
  center: [35.912, -79.08],
  zoom: 16,
  layers: [topo]
});

L.control.layers(
  { "NC Imagery": imagery, "Esri Topographic": topo },
  {},
  { collapsed:false }
).addTo(map);

// ----------------------
// FeatureLayer (for sync)
// ----------------------
const featureLayer = L.esri.featureLayer({
  url: "https://services5.arcgis.com/uqbGfOz5OnchALvN/arcgis/rest/services/general_purpose_point_layer/FeatureServer/0"
});

// ----------------------
// Local markers
// ----------------------
const localMarkers = L.featureGroup().addTo(map);

function renderLocalPoints() {
  localMarkers.clearLayers();
  const points = loadPoints();

  points.forEach(pt => {
    const marker = L.circleMarker([pt.lat, pt.lng], {
      radius: 6,
      color: "red",
      weight: 2,
      fillOpacity: 0.9
    });

    marker.bindPopup(`
      <div>
        <strong>Notes:</strong><br>
        <div style="margin:6px 0; padding:6px; border:1px solid #ccc;">
          ${pt.notes || "(no notes added)"}
        </div>
        <button class="delete-btn" id="deletePointBtn">Delete Point</button>
      </div>
    `);

    marker.on("popupopen", ev => {
      const popupEl = ev.popup.getElement();
      const btn = popupEl.querySelector("#deletePointBtn");
      if (!btn) return;

      btn.onclick = () => {
        const updated = loadPoints().filter(p => p.localId !== pt.localId);
        savePoints(updated);
        localMarkers.removeLayer(marker);

        if (pt.serverId != null) {
          const queue = loadDeleteQueue();
          if (!queue.includes(pt.serverId)) {
            queue.push(pt.serverId);
            saveDeleteQueue(queue);
          }
        }
      };
    });

    localMarkers.addLayer(marker);
  });
}

// ----------------------
// Load existing server features into localStorage
// ----------------------
const query = featureLayer.query();

query.where("1=1")
     .returnGeometry(true)
     .fields(["*"])
     .run((err, fc) => {
        if (err) {
          console.error("Query error:", err);
          renderLocalPoints();
          return;
        }

        const existing = loadPoints();

        const serverPoints = fc.features
          .filter(f => f.attributes && f.geometry)
          .map(f => ({
            localId: "srv_" + f.attributes.OBJECTID,
            serverId: f.attributes.OBJECTID,
            lat: f.geometry.y,
            lng: f.geometry.x,
            notes: f.attributes.Notes || "(no notes added)"
          }));

        const merged = [
          ...serverPoints.filter(sp => !existing.some(ep => ep.localId === sp.localId)),
          ...existing
        ];

        savePoints(merged);
        renderLocalPoints();
     });

// ----------------------
// Add point flow
// ----------------------
function addNewPoint(latlng, notes) {
  const points = loadPoints();
  const newLocalId = "loc_" + Date.now();

  const newPoint = {
    localId: newLocalId,
    serverId: null,
    lat: latlng.lat,
    lng: latlng.lng,
    notes: notes || ""
  };

  points.push(newPoint);
  savePoints(points);
  renderLocalPoints();

  featureLayer.addFeature({
    type: "Feature",
    geometry: {
      type: "Point",
      coordinates: [latlng.lng, latlng.lat]
    },
    properties: {
      Notes: notes || ""
    }
  }, (err, result) => {
    if (!err && result && result.objectId != null) {
      const updated = loadPoints().map(p =>
        p.localId === newLocalId ? { ...p, serverId: result.objectId } : p
      );
      savePoints(updated);
    } else if (err) {
      console.warn("Add feature failed:", err);
    }
  });
}

// ----------------------
// Upload attachment
// ----------------------
function uploadAttachment(objectId, file) {
  const url =
    "https://services5.arcgis.com/uqbGfOz5OnchALvN/arcgis/rest/services/general_purpose_point_layer/FeatureServer/0/" +
    objectId +
    "/addAttachment";

  const formData = new FormData();
  formData.append("attachment", file);
  formData.append("f", "json");

  fetch(url, {
    method: "POST",
    body: formData
  })
  .then(r => r.json())
  .then(result => {
    console.log("Attachment upload result:", result);
  })
  .catch(err => {
    console.error("Attachment upload failed:", err);
  });
}

// ----------------------
// Popup for adding points
// ----------------------
map.on("click", e => {
  if (e.originalEvent.target.classList.contains("leaflet-interactive")) return;

  const latlng = e.latlng;

  const popupHTML = `
    <div>
      <textarea id="newPointNotes"
        placeholder="Optional notes…"
        style="width:100%;height:60px;"></textarea>

      <input type="file" id="newPointPhoto"
        accept="image/*"
        style="margin-top:8px;width:100%;">

      <button id="addPointBtn" style="
        margin-top:8px;
        width:100%;
        padding:6px;
        background:#0078ff;
        color:white;
        border:none;
        border-radius:4px;
        cursor:pointer;
      ">Add Point</button>
    </div>
  `;

  L.popup()
    .setLatLng(latlng)
    .setContent(popupHTML)
    .openOn(map);

  window._pendingLatLng = latlng;
});

// Delegated click handler
document.addEventListener("click", e => {
  if (e.target && e.target.id === "addPointBtn") {
    const textarea = document.getElementById("newPointNotes");
    const photoInput = document.getElementById("newPointPhoto");
    const notes = textarea ? textarea.value.trim() : "";
    const latlng = window._pendingLatLng;

    if (!latlng) return;

    addNewPoint(latlng, notes);

    if (photoInput && photoInput.files.length > 0) {
      const file = photoInput.files[0];

      setTimeout(() => {
        const points = loadPoints();
        const newPoint = points[points.length - 1];

        if (newPoint.serverId) {
          uploadAttachment(newPoint.serverId, file);
        }
      }, 800);
    }

    map.closePopup();
    window._pendingLatLng = null;
  }
});

// ----------------------
// Delete queue worker
// ----------------------
setInterval(() => {
  const queue = loadDeleteQueue();
  if (!queue.length) return;

  const serverId = queue[0];

  const url =
    "https://services5.arcgis.com/uqbGfOz5OnchALvN/arcgis/rest/services/general_purpose_point_layer/FeatureServer/0/deleteFeatures";

  const params = new URLSearchParams({
    objectIds: serverId,
    f: "json"
  });

  fetch(url, {
    method: "POST",
    body: params
  })
  .then(r => r.json())
  .then(result => {
    if (result.deleteResults && result.deleteResults[0].success) {
      const newQueue = loadDeleteQueue().filter(id => id !== serverId);
      saveDeleteQueue(newQueue);
    } else {
      console.warn("Server delete failed:", result);
    }
  })
  .catch(err => {
    console.warn("Delete request error:", err);
  });

}, 10000);

// ----------------------
// Geolocation
// ----------------------
document.getElementById("locateBtn").onclick = () => {
  map.locate({ setView: true, maxZoom: 17 });
};

map.on("locationfound", e => {
  L.circleMarker(e.latlng, {
    radius: 8,
    color: "blue",
    weight: 2,
    fillOpacity: 0.7
  }).addTo(map);
});
</script>
</body>
</html>
